<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="310" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc">
<title id="title">Yousef Osama — Security Engineering Console</title>
<desc id="desc">A dark terminal-inspired identity panel for Yousef Osama focused on SOC, defensive security, detection engineering and secure software.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#05070B"/>
    <stop offset=".58" stop-color="#090E17"/>
    <stop offset="1" stop-color="#071015"/>
  </linearGradient>

  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#22D3EE"/>
    <stop offset=".55" stop-color="#38BDF8"/>
    <stop offset="1" stop-color="#22C55E"/>
  </linearGradient>

  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#22D3EE" stop-opacity=".85"/>
    <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </linearGradient>

  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#1C2938" stroke-width="1" opacity=".28"/>
  </pattern>

  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <clipPath id="panelClip">
    <rect x="1" y="1" width="1098" height="308" rx="24"/>
  </clipPath>
</defs>

<rect x="1" y="1" width="1098" height="308" rx="24" fill="url(#bg)" stroke="#223044"/>
<rect x="1" y="1" width="1098" height="308" rx="24" fill="url(#grid)"/>

<g clip-path="url(#panelClip)">
  <rect x="-170" y="242" width="520" height="1.5" fill="url(#fade)" opacity=".5">
    <animate attributeName="x" values="-520;1100" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="0" width="6" height="310" fill="url(#accent)"/>
</g>

<g font-family="Consolas,Menlo,monospace">
  <text x="42" y="37" fill="#53657B" font-size="11" letter-spacing="2.2">SECURITY CONSOLE // IDENTITY NODE</text>
  <circle cx="1034" cy="29" r="4" fill="#22C55E" filter="url(#glow)"/>
  <text x="1050" y="33" fill="#60816F" font-size="10">ONLINE</text>
</g>

<g font-family="Segoe UI,Arial,sans-serif">
  <text x="42" y="106" fill="#F8FAFC" font-size="48" font-weight="800" letter-spacing="1.4">YOUSEF OSAMA</text>
  <text x="42" y="137" fill="#22D3EE" font-size="16" font-weight="700" letter-spacing="2.1">CYBERSECURITY ENGINEERING</text>
  <text x="42" y="166" fill="#A7B7C9" font-size="15" font-weight="600" letter-spacing="1.2">SOC · DEFENSIVE SECURITY · SECURITY-MINDED SOFTWARE</text>
</g>

<rect x="42" y="188" width="452" height="2" rx="1" fill="url(#accent)"/>

<g font-family="Consolas,Menlo,monospace" font-size="12">
  <text x="42" y="220" fill="#64748B">&gt; mission</text>
  <text x="116" y="220" fill="#CBD5E1">detect → investigate → verify → improve</text>
  <text x="42" y="244" fill="#64748B">&gt; principle</text>
  <text x="128" y="244" fill="#CBD5E1">evidence over assumptions</text>
</g>

<g transform="translate(615 61)">
  <rect width="435" height="173" rx="16" fill="#070C13" stroke="#26384E"/>
  <rect x="0" y="0" width="435" height="31" rx="16" fill="#0D1520"/>
  <rect x="0" y="18" width="435" height="13" fill="#0D1520"/>

  <circle cx="18" cy="15" r="4" fill="#EF4444"/>
  <circle cx="34" cy="15" r="4" fill="#F59E0B"/>
  <circle cx="50" cy="15" r="4" fill="#22C55E"/>

  <text x="217" y="20" text-anchor="middle" fill="#607287" font-family="Consolas,Menlo,monospace" font-size="10">usef@github: ~/profile</text>

  <g font-family="Consolas,Menlo,monospace" font-size="11">
    <text x="20" y="57" fill="#22D3EE">$ whoami</text>
    <text x="20" y="79" fill="#E2E8F0">Yousef Osama</text>

    <text x="20" y="105" fill="#64748B">ROLE</text>
    <text x="108" y="105" fill="#CBD5E1">Cybersecurity Engineering Student</text>

    <text x="20" y="127" fill="#64748B">FOCUS</text>
    <text x="108" y="127" fill="#CBD5E1">SOC / NDR / DFIR / Detection</text>

    <text x="20" y="149" fill="#64748B">MODE</text>
    <text x="108" y="149" fill="#86EFAC">BUILDING + SHIPPING</text>

    <rect x="262" y="139" width="7" height="13" rx="1" fill="#86EFAC">
      <animate attributeName="opacity" values="1;0;1" dur="1.05s" repeatCount="indefinite"/>
    </rect>
  </g>
</g>

<g font-family="Consolas,Menlo,monospace" font-size="10" font-weight="700">
  <g transform="translate(42 268)">
    <rect width="118" height="25" rx="6" fill="#071722" stroke="#164C63"/>
    <text x="59" y="16" text-anchor="middle" fill="#67E8F9">NETSHIELD</text>
  </g>
  <g transform="translate(170 268)">
    <rect width="100" height="25" rx="6" fill="#0B1B13" stroke="#1E6B3C"/>
    <text x="50" y="16" text-anchor="middle" fill="#86EFAC">SHIFAA</text>
  </g>
  <g transform="translate(280 268)">
    <rect width="82" height="25" rx="6" fill="#141423" stroke="#514899"/>
    <text x="41" y="16" text-anchor="middle" fill="#C4B5FD">MEC</text>
  </g>
  <g transform="translate(372 268)">
    <rect width="134" height="25" rx="6" fill="#17111A" stroke="#824366"/>
    <text x="67" y="16" text-anchor="middle" fill="#F9A8D4">SOLAR ODYSSEY</text>
  </g>
  <g transform="translate(516 268)">
    <rect width="122" height="25" rx="6" fill="#1B170C" stroke="#7A6522"/>
    <text x="61" y="16" text-anchor="middle" fill="#FDE68A">AL-TAYYIBAT</text>
  </g>
</g>

<g opacity=".5" stroke="#334155" fill="none">
  <circle cx="1044" cy="267" r="24"/>
  <circle cx="1044" cy="267" r="14"/>
  <path d="M1013 267h62M1044 236v62"/>
</g>
<circle cx="1044" cy="267" r="3" fill="#22D3EE" filter="url(#glow)"/>

<text x="827" y="288" fill="#475569" font-family="Consolas,Menlo,monospace" font-size="10">@YousefE1bana · Cairo, Egypt</text>
</svg>