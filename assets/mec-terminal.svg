<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="t d">
<title id="t">MEC MSI EC Control Center</title><desc id="d">USEF-styled terminal panel representing the MEC Linux TUI project.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset="1" stop-color="#08111c"/></linearGradient>
<linearGradient id="edge" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#38bdf8" stroke-opacity=".04"/></pattern>
<filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="900" height="340" rx="22" fill="url(#bg)"/><rect width="900" height="340" rx="22" fill="url(#grid)"/><rect x="10" y="10" width="880" height="320" rx="18" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
<rect x="10" y="10" width="880" height="38" rx="18" fill="#07111f"/><rect x="10" y="30" width="880" height="18" fill="#07111f"/>
<circle cx="30" cy="29" r="5" fill="#ef4444"/><circle cx="49" cy="29" r="5" fill="#f59e0b"/><circle cx="68" cy="29" r="5" fill="#22c55e"/>
<text x="450" y="33" text-anchor="middle" fill="#64748b" font-family="Consolas,monospace" font-size="11">usef@mec: ~/control-center</text>
<text x="34" y="82" fill="#67e8f9" font-family="Consolas,monospace" font-size="13">$ mec status</text>
<text x="34" y="111" fill="#e2e8f0" font-family="Consolas,monospace" font-size="12">support       READY</text>
<text x="34" y="136" fill="#e2e8f0" font-family="Consolas,monospace" font-size="12">interface     interactive TUI</text>
<text x="34" y="161" fill="#e2e8f0" font-family="Consolas,monospace" font-size="12">safety        validated writes + readback</text>
<text x="34" y="186" fill="#e2e8f0" font-family="Consolas,monospace" font-size="12">profiles      transactional + rollback</text>
