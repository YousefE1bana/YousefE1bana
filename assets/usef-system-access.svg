<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="t d">
<title id="t">USEF System Access</title><desc id="d">Three primary project systems: NetShield, SHIFAA and MEC.</desc>
<defs>
