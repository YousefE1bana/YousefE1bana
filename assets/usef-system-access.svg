<linearGradient id="flow" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#22d3ee"/><stop offset=".46" stop-color="#3b82f6"/><stop offset=".72" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
