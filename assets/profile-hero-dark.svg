<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">Yousef Osama — Cybersecurity Engineering</title>
<desc id="desc">Dark technical profile banner for Yousef Osama, focused on defensive security, network detection, Linux, healthcare software and graphics engineering.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070B14"/>
    <stop offset="0.55" stop-color="#0B1324"/>
    <stop offset="1" stop-color="#07141A"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#38BDF8"/>
    <stop offset="1" stop-color="#22C55E"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#26344A" stroke-width="1" opacity=".24"/>
  </pattern>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

